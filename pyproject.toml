[build-system]
requires = ["setuptools>=61.0", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radioglobe"
# version is managed dynamically via setuptools_scm
dynamic = ["version"]
description = "RadioGlobe is an internet radio player originally by Jude Pullen (Hey Jude), Donald Robson and Peter Milne."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.13",
    "evdev>=1.7.0",
    "lgpio>=0.2.2.0",
    "python-vlc>=3.0.21203",
    "requests>=2.32.4",
    "rpi-lgpio>=0.6",
    "smbus>=1.1.post2",
    "spidev>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["radioglobe*"]

[project.scripts]
radioglobe = "radioglobe.cli:main"

[tool.setuptools_scm]
# write the resolved version into the package so runtime can import it
write_to = "src/radioglobe/_version.py"
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)$"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["integration"]

[tool.ruff]
line-length = 100
indent-width = 4
