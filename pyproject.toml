[build-system]
requires = ["setuptools>=61.0", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radioglobe"
# version is managed dynamically via setuptools_scm
dynamic = ["version"]
description = "RadioGlobe is an internet radio player originally by Jude Pullen (Hey Jude), Donald Robson and Peter Milne."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.13",
    "requests>=2.32.4",
]

[project.optional-dependencies]
# Hardware-backed modules (dial.py, positional_encoders.py, buttons.py,
# display.py, audio_async.py) need these; the core package,
# radioglobe.hal's Protocols/fakes, and the unit test suite do not.
# rgb_led.py needs none of these - it's kernel-driven via sysfs
# (dtoverlay=gpio-led) using only the stdlib, same as dial.py/buttons.py's
# evdev-based kernel drivers. Install with `pip install .[pi]`
# (or `uv sync --extra pi`) on the device.
pi = [
    "evdev>=1.7.0",
    "python-vlc>=3.0.21203",
    "smbus>=1.1.post2",
    "spidev>=3.7",
    "liquidcrystal-i2c @ git+https://github.com/pl31/python-liquidcrystal_i2c.git@e26e4d22f039e9a2c04580dda072e8ca9693d1bb",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["radioglobe*"]

[project.scripts]
radioglobe = "radioglobe.cli:main"

[tool.setuptools_scm]
# write the resolved version into the package so runtime can import it
write_to = "src/radioglobe/_version.py"
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)$"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["integration"]

[tool.ruff]
line-length = 100
indent-width = 4
